        if (ogiTheme === "system") {
          ogiTheme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";

        var resolvedTheme = ogiTheme === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = resolvedTheme;
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) {
          themeMeta.setAttribute("content", resolvedTheme === "light" ? "#f4f6fa" : "#0e1522");
        }
      } catch (e) {}
    </script>
